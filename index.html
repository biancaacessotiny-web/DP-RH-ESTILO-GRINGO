:var(--yl)}\n.hb.tm{text-align:left;font-size:12px;line-height:1.6}.hb.tm b{font-size:11px;color:var(--c);font-weight:600}.hb.tm b+b{margin-top:6px}\n.hg{display:grid;grid-template-columns:150px 32px repeat(6,minmax(0,1fr));column-gap:6px}\n.ar{display:flex;flex-direction:column;align-items:center;padding-top:2px}\n.ar:before{content:\"\";width:2px;height:14px;background:var(--mut)}\n.ar:after{content:\"\";border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid var(--mut)}\n.arh{display:flex;align-items:center;justify-content:center}\n.arh:before{content:\"\";width:14px;height:2px;background:var(--mut)}\n.arh:after{content:\"\";border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid var(--mut)}\n.hc{position:relative;height:38px}.hc i{position:absolute;background:var(--mut)}\n.hc u{position:absolute;margin-left:-6px;bottom:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--mut)}\n.hnav{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;touch-action:pan-y}\n.hnav button{border:0;background:none;color:var(--mut);font-size:30px;line-height:1;padding:0 12px;opacity:.7}.hnav button:hover{color:var(--yl);opacity:1}\n.hlab{text-align:center;min-width:150px}.hlab b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:22px;letter-spacing:2px;line-height:1.1}\n.hlab span i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bk3);margin:0 3px}.hlab span i.on{background:var(--yl)}\n.mbar{background:var(--bk3);border-left:3px solid var(--c);padding:4px 6px}\n.hb small.rl{color:var(--ok);font-weight:600;font-size:12px}\n.list{background:var(--bk2);border:1px solid var(--bk3);padding:14px}\n.row{display:grid;grid-template-columns:72px 1fr auto;gap:6px 14px;align-items:center;background:var(--bk);border:1px solid var(--bk3);border-left:6px solid var(--bk3);padding:8px 10px;margin-bottom:6px}\n.row:last-child{margin-bottom:0}\n.d{text-align:center}\n.d b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:38px;line-height:1;letter-spacing:1px}.d small{color:var(--mut);font-size:12px}\n.row.hot{border-left-color:var(--late)}.row.hot .d b{color:var(--late)}\n.row.warm{border-left-color:var(--op)}.row.warm .d b{color:var(--op)}\n.nm{font-weight:600;overflow-wrap:anywhere}.mt{color:var(--mut);font-size:13px}\n.act{display:flex;gap:6px;align-items:center}\n.act select{padding:6px;font-size:14px}\n.st-plan{border-color:var(--op)!important}.st-ready{border-color:var(--yl)!important;color:var(--yl)}.st-done{border-color:var(--ok)!important;background:var(--ok)!important;color:#000!important;font-weight:600}\n.empty{padding:20px;text-align:center;color:var(--mut)}\n.foot{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:13px}\ndialog{border:2px solid var(--yl);border-radius:0;background:var(--bk2);color:var(--wh);padding:20px;width:min(440px,92vw)}\ndialog::backdrop{background:rgba(0,0,0,.75)}\ndialog h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:28px;letter-spacing:2px;color:var(--yl)}\ndialog label{display:block;font-size:13px;color:var(--mut);margin-top:12px}\ndialog input,dialog select,dialog textarea{width:100%;margin-top:4px}\n.dbtn{display:flex;gap:8px;margin-top:18px}.dbtn .sp{flex:1}\n@media (max-width:560px){.row{grid-template-columns:60px 1fr}.act{grid-column:1 / -1}.act select{flex:1}}\n<\/style>\n<\/head>\n<body>\n<header><h1>ANIVERSÁRIOS <span>· ESTILO GRINGO<\/span><\/h1><\/header>\n<main>\n<p class=\"sub\">Veja quem faz aniversário primeiro e acompanhe o planejamento de cada surpresa.<\/p>\n<section class=\"hero\" aria-live=\"polite\"><div class=\"n\" id=\"hn\">–<\/div><div class=\"t\"><b id=\"hname\"><\/b><span id=\"hmeta\"><\/span><\/div><\/section>\n<div class=\"stats\" id=\"stats\"><\/div>\n<section class=\"pie\" aria-labelledby=\"pt\"><h2 id=\"pt\">EQUIPE POR SETOR<\/h2><div class=\"in\"><svg id=\"pz\" viewBox=\"-110 -110 220 220\" role=\"img\" aria-label=\"Gráfico de pizza com a quantidade de pessoas por setor\"><\/svg><ul id=\"pl\"><\/ul><\/div><\/section>\n<div class=\"bar\">\n<input type=\"search\" id=\"q\" placeholder=\"Buscar por nome\" aria-label=\"Buscar por nome\">\n<select id=\"fl\" aria-label=\"Filtrar por loja\"><option value=\"\">Todas as lojas<\/option><\/select>\n<select id=\"fs\" aria-label=\"Filtrar por setor\"><option value=\"\">Todos os setores<\/option><\/select>\n<select id=\"fm\" aria-label=\"Filtrar por mês\"><option value=\"\">Todos os meses<\/option><\/select>\n<button class=\"p\" id=\"add\">Adicionar pessoa<\/button>\n<\/div>\n<div class=\"list\" id=\"list\"><\/div>\n<div class=\"foot\">\n<button id=\"csv\">Baixar CSV<\/button><button id=\"bk\">Salvar backup<\/button><button id=\"rs\">Restaurar backup<\/button>\n<input type=\"file\" id=\"file\" accept=\".json\" hidden>\n<span>As alterações ficam salvas neste navegador. Use o backup para levar os dados a outro aparelho.<\/span>\n<\/div>\n<\/main>\n<dialog id=\"dlg\"><form id=\"f\" method=\"dialog\" onsubmit=\"return false\">\n<h2 id=\"dt\" style=\"margin:0 0 4px\">Pessoa<\/h2>\n<label>Nome completo<input id=\"e-nome\" required><\/label>\n<label>Loja<input id=\"e-loja\" list=\"lojas\"><\/label><datalist id=\"lojas\"><\/datalist>\n<label>Setor<select id=\"e-setor\"><\/select><\/label>\n<label style=\"display:flex;gap:8px;align-items:center\"><input type=\"checkbox\" id=\"e-af\" style=\"width:auto;margin:0\"> Afastado<\/label>\n<label>Data de nascimento<input id=\"e-nasc\" type=\"date\"><\/label>\n<label>Data de admissão<input id=\"e-adm\" type=\"date\"><\/label>\n<label>Situação da surpresa<select id=\"e-st\"><option value=\"\">Sem plano<\/option><option value=\"plan\">Planejando<\/option><option value=\"ready\">Pronta<\/option><option value=\"done\">Feita<\/option><\/select><\/label>\n<label>Ideia e responsável<textarea id=\"e-nota\" rows=\"3\" placeholder=\"Ex.: bolo no intervalo, quem compra o presente\"><\/textarea><\/label>\n<div class=\"dbtn\"><button type=\"button\" id=\"del\">Excluir<\/button><span class=\"sp\"><\/span><button type=\"button\" id=\"cn\">Cancelar<\/button><button type=\"button\" class=\"p\" id=\"sv\">Salvar<\/button><\/div>\n<\/form><\/dialog>\n<script>\nconst SEED=\"Airla Alexandre de Vasconcelos|J|2003-11-04|2026-07-02;Ana Júlia Veiga da Costa|C|2006-06-12|2026-06-18;Angelo Daniel da Silva|C|2004-03-26|2025-07-26;Bianca dos Santos Silva|C|1998-02-18|2024-04-01;Brunaly Silva Rocha|C|1999-01-13|2026-07-02;Davi Sol Lyra Santos|C|2004-02-06|2026-05-02;Djhon Vitor Campos dos Santos|C|2000-12-25|2023-05-08;Isamara Luana Sousa dos Santos|C|2000-07-22|2026-07-02;João Henrique dos Santos Andrade|C|2003-04-14|2026-01-10;Ketlen Emanuele Oliveira Guimarães|K|2003-08-16|2026-01-16;Lilian Beatriz da Silva Queiroz|C|2003-12-22|2026-06-18;Lucas de Sousa Lima|C|1999-03-17|2025-11-10;Lucas Oliveira da Silva|C|2005-07-07|2026-05-02;Maria Julia Barros de Carvalho|K|2006-05-04|2026-05-25;Nathálya Munyck Silva Vieira|K|2006-11-08|2026-05-25;Nayara Silva dos Santos|K|2000-05-27|2024-03-01;Petrônio de Souza Cavalcante Souto Junior|C|2004-06-22|2021-07-01;Rafael Farias da Silva|C|2003-12-10|2025-09-01;Renan Benicio Costa|C|1993-04-10|2023-05-08;Renan Teles Marques da Silva|C|1999-08-05|2026-03-19;Rian Gracie Pereira da Silva Lima|J|2002-09-06|2026-06-23;Roosevelt Luan Melo Batista|C|2003-11-08|2026-02-12;Sergio Pereira dos Santos|J|1997-08-07|2025-10-01;Thalyta Raquel Sousa Santos|K|1997-04-12|2026-01-16;Wagner Gonzaga de Brito|C|1996-07-26|2025-06-17\";\nconst LJ={C:\"Loja Centro\",K:\"Loja Centro Kids\",J:\"Loja Juscelino Kubitschek\"};\nconst MESES=[\"janeiro\",\"fevereiro\",\"março\",\"abril\",\"maio\",\"junho\",\"julho\",\"agosto\",\"setembro\",\"outubro\",\"novembro\",\"dezembro\"];\nconst STL={\"\":\"Sem plano\",plan:\"Planejando\",ready:\"Pronta\",done:\"Feita\"};\nconst KEY=\"aniv-equipe-v1\";\nconst SETORES=[\"Loja Física Centro\",\"Loja Física Cruzeiro\",\"Loja Kids\",\"Loja Online\",\"Expedição e Suporte\",\"Mídia / MKT / Design\",\"Financeiro / Departamento Pessoal\"];\nconst COR=[\"#B4F000\",\"#FFD400\",\"#ff7a3d\",\"#ff4d9a\",\"#4da6ff\",\"#a78bfa\",\"#19d3c5\"],COR_SEM=\"#777\";\nconst SN={\"Renan Benicio Costa\":0,\"Wagner Gonzaga de Brito\":0,\"João Henrique dos Santos Andrade\":0,\"Brunaly Silva Rocha\":0,\"Isamara Luana Sousa dos Santos\":0,\"Sergio Pereira dos Santos\":1,\"Rian Gracie Pereira da Silva Lima\":1,\"Angelo Daniel da Silva\":1,\"Airla Alexandre de Vasconcelos\":1,\"Nayara Silva dos Santos\":2,\"Ketlen Emanuele Oliveira Guimarães\":2,\"Thalyta Raquel Sousa Santos\":2,\"Nathálya Munyck Silva Vieira\":2,\"Bianca dos Santos Silva\":3,\"Lilian Beatriz da Silva Queiroz\":3,\"Ana Júlia Veiga da Costa\":3,\"Lucas de Sousa Lima\":4,\"Petrônio de Souza Cavalcante Souto Junior\":4,\"Rafael Farias da Silva\":5,\"Djhon Vitor Campos dos Santos\":5,\"Lucas Oliveira da Silva\":5,\"Roosevelt Luan Melo Batista\":4,\"Davi Sol Lyra Santos\":5,\"Maria Julia Barros de Carvalho\":2,\"Renan Teles Marques da Silva\":6};\nconst setorDe=n=>SN[n]===undefined?\"\":SETORES[SN[n]];\nconst EXTRA=[{id:\"pj\",nome:\"Jefferson\",setor:\"Expedição e Suporte\"},{id:\"pm\",nome:\"Junior Silva\",setor:\"Mídia / MKT / Design\"},{id:\"pc\",nome:\"Cristian\",setor:\"Mídia / MKT / Design\"}];\nconst RM=[\"Jhonatan Albino\",\"Jonatha da Silva\",\"Marcela Viviane\"];\nfunction migra(v){let mig=false;try{mig=localStorage.getItem(KEY+\"-m2\")===\"1\"}catch(e){}\n if(!mig)v=v.filter(p=>!(p.nome&&RM.some(r=>p.nome.startsWith(r))));\n v.forEach(p=>{if(p.setor===undefined)p.setor=setorDe(p.nome)});v.forEach(p=>{if(p.setor===\"Financeiro / RH\")p.setor=SETORES[6]});\n let m3=false;try{m3=localStorage.getItem(KEY+\"-m3\")===\"1\"}catch(e){}\n if(!m3){v.forEach(p=>{if(p.nome&&p.nome.startsWith(\"Maria Julia Barros\")&&p.setor===SETORES[5])p.setor=\"\";if(p.nome&&
