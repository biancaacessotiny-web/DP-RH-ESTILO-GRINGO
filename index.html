<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hierarquia de Funções · Estilo Gringo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bk:#000;
  --bk2:#141414;
  --bk3:#232323;
  --yl:#B4F000;
  --wh:#fff;
  --mut:#9a9a9a;
  --ok:#2ecc71;
  --op:#FFD400;
  --late:#ff4d4d;
  --dir:#791F1F;
  --dir-borda:#F09595;
  --ges:#633806;
  --ges-borda:#EF9F27;
  --lid:#27500A;
  --lid-borda:#97C459;
  --op:#085041;
  --op-borda:#5DCAA5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bk);
  color:var(--wh);
  font-family:Barlow,Arial,sans-serif;
  color-scheme:dark;
  min-height:100vh
}
header{
  border-bottom:4px solid var(--yl);
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px
}
h1{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:42px;
  letter-spacing:3px;
  margin:0;
  color:var(--yl);
  line-height:1;
  font-weight:400
}
h1 span{color:var(--wh)}
.sub{color:var(--mut);margin:0 0 16px;font-size:15px}
main{max-width:1200px;margin:0 auto;padding:20px}
.piramide-container{
  background:var(--bk2);
  border:1px solid var(--bk3);
  border-top:3px solid var(--yl);
  padding:24px;
  margin-bottom:24px
}
.piramide-svg{
  width:100%;
  height:auto;
  display:block
}
.btn{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:18px;
  letter-spacing:1.5px;
  padding:8px 20px;
  border:none;
  cursor:pointer;
  transition:all .2s
}
.btn-editar{
  background:transparent;
  border:2px solid var(--yl);
  color:var(--yl)
}
.btn-editar:hover{
  background:var(--yl);
  color:#000
}
.btn-voltar{
  background:var(--yl);
  color:#000;
  margin-bottom:20px
}
.btn-primario{
  background:var(--yl);
  color:#000
}
.btn-secundario{
  background:transparent;
  border:1px solid var(--wh);
  color:var(--wh)
}
.btn-perigo{
  background:transparent;
  border:1px solid var(--late);
  color:var(--late)
}
.area-edicao{
  display:none;
  background:var(--bk2);
  border:1px solid var(--bk3);
  border-top:3px solid var(--op);
  padding:24px;
  margin-bottom:24px
}
.area-edicao.ativa{display:block}
.categoria{
  margin-bottom:24px;
  border-left:4px solid var(--bk3);
  padding-left:16px
}
.cat-dir{border-color:var(--dir)}
.cat-ges{border-color:var(--ges)}
.cat-lid{border-color:var(--lid)}
.cat-op{border-color:var(--op)}
.categoria h3{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:22px;
  letter-spacing:1.5px;
  margin-bottom:12px
}
.cat-dir h3{color:var(--dir-borda)}
.cat-ges h3{color:var(--ges-borda)}
.cat-lid h3{color:var(--lid-borda)}
.cat-op h3{color:var(--op-borda)}
.pessoa{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--bk3);
  flex-wrap:wrap
}
.pessoa-nome{flex:1;min-width:180px}
.pessoa-cargo{color:var(--mut);font-size:14px}
.pessoa-acoes{display:flex;gap:6px}
.form-grupo{
  margin-bottom:16px
}
.form-grupo label{
  display:block;
  font-size:13px;
  color:var(--mut);
  margin-bottom:4px
}
.form-grupo input, .form-grupo select{
  width:100%;
  padding:10px;
  background:var(--bk);
  border:1px solid var(--bk3);
  color:var(--wh);
  font:inherit
}
.form-grupo input:focus, .form-grupo select:focus{
  outline:2px solid var(--yl);
  outline-offset:1px
}
.linha-botoes{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:20px
}
.aviso{
  background:rgba(180,240,0,.1);
  border-left:3px solid var(--yl);
  padding:10px 14px;
  margin-bottom:16px;
  font-size:14px
}
.titulo-secao{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:24px;
  letter-spacing:2px;
  color:var(--yl);
  margin:24px 0 12px
}
.sem-dados{
  color:var(--mut);
  font-style:italic;
  padding:10px 0
}
@media (max-width:768px){
  .pessoa{flex-direction:column;align-items:flex-start;gap:6px}
  .pessoa-acoes{align-self:flex-start}
}
</style>
</head>
<body>
<header>
  <h1>HIERARQUIA <span>· ESTILO GRINGO</span></h1>
  <button class="btn btn-editar" id="btnEditar">✏️ EDITAR ESTRUTURA</button>
</header>

<main>
  <p class="sub">Quem lidera quem — visualização da pirâmide organizacional</p>

  <!-- Área de Visualização (mesmo padrão da foto) -->
  <section class="piramide-container" id="areaVisualizacao">
    <svg class="piramide-svg" viewBox="0 0 1664 700" id="svgHierarquia">
      <!-- Os polígonos e textos serão gerados pelo JavaScript -->
    </svg>
  </section>

  <!-- Área de Edição -->
  <section class="area-edicao" id="areaEdicao">
    <button class="btn btn-voltar" id="btnVoltar">← VOLTAR PARA VISUALIZAÇÃO</button>
    
    <div class="aviso">
      ✏️ Aqui você pode gerenciar toda a estrutura da hierarquia. As alterações aparecem imediatamente na pirâmide acima.
    </div>

    <!-- Adicionar Nova Categoria -->
    <h3 class="titulo-secao">➕ NOVA CATEGORIA</h3>
    <div class="form-grupo">
      <label>Nome da categoria</label>
      <input type="text" id="novaCatNome" placeholder="Ex: Direção, Gestão, Liderança...">
    </div>
    <div class="form-grupo">
      <label>Cor de destaque</label>
      <select id="novaCatCor">
        <option value="dir">Vermelho — Direção</option>
        <option value="ges">Amarelo — Gestão</option>
        <option value="lid">Verde Claro — Liderança</option>
        <option value="op">Verde Escuro — Operacional</option>
      </select>
    </div>
    <button class="btn btn-primario" id="btnAddCat">Adicionar Categoria</button>

    <!-- Adicionar Pessoa -->
    <h3 class="titulo-secao">👤 ADICIONAR PESSOA</h3>
    <div class="form-grupo">
      <label>Nome</label>
      <input type="text" id="novaPessoaNome" placeholder="Nome completo">
    </div>
    <div class="form-grupo">
      <label>Cargo / Função</label>
      <input type="text" id="novaPessoaCargo" placeholder="Ex: Gerente, Vendedor...">
    </div>
    <div class="form-grupo">
      <label>Loja / Setor (opcional)</label>
      <input type="text" id="novaPessoaLocal" placeholder="Ex: Loja JK, Financeiro...">
    </div>
    <div class="form-grupo">
      <label>Hierarquia</label>
      <select id="novaPessoaCat"></select>
    </div>
    <button class="btn btn-primario" id="btnAddPessoa">Adicionar Pessoa</button>

    <!-- Lista de Categorias e Pessoas -->
    <h3 class="titulo-secao">📋 ESTRUTURA ATUAL</h3>
    <div id="listaEstrutura"></div>
  </section>
</main>

<script>
// Dados iniciais — exatamente conforme a imagem
let dados = {
  categorias: [
    {
      id: 'dir',
      nome: 'Direção',
      cor: 'dir',
      pessoas: [
        {id:'p1', nome:'Thalisson', cargo:'CEO / Proprietário', local:''},
        {id:'p2', nome:'Renaly', cargo:'Sócia-Diretora', local:''}
      ]
    },
    {
      id: 'ges',
      nome: 'Gestão',
      cor: 'ges',
      pessoas: [
        {id:'p3', nome:'Renan Marques', cargo:'Fin./DP', local:''}
      ]
    },
    {
      id: 'lid',
      nome: 'Liderança',
      cor: 'lid',
      pessoas: [
        {id:'p4', nome:'Bianca', cargo:'Gerente', local:'Loja Online'},
        {id:'p5', nome:'Sergio', cargo:'Gerente', local:'JK'},
        {id:'p6', nome:'Renan Benicio', cargo:'Gerente', local:'Loja Física'},
        {id:'p7', nome:'Nayara', cargo:'Gerente', local:'Kids'},
        {id:'p8', nome:'Lucas Lima', cargo:'Gerente', local:'Expedição'},
        {id:'p9', nome:'Junior', cargo:'Gestor', local:'Marketing / Site'}
      ]
    },
    {
      id: 'op',
      nome: 'Equipe Operacional',
      cor: 'op',
      pessoas: [
        {id:'p10', nome:'Beatriz · Ana Julia', cargo:'Vendedoras', local:'Online'},
        {id:'p11', nome:'Airla · Rian · Daniel', cargo:'Vendedores', local:'JK'},
        {id:'p12', nome:'Wagner · Brunaly · Henrique', cargo:'Vendedores', local:'Centro'},
        {id:'p13', nome:'Maria Julia · Thalita · Nathalya · Ketlen', cargo:'Vendedoras', local:'Kids'},
        {id:'p14', nome:'Isamara', cargo:'Operadora de Caixa', local:'Centro'},
        {id:'p15', nome:'Petrônio Junior · Jefferson · Luan (afastado)', cargo:'Estoquistas', local:'Expedição'},
        {id:'p16', nome:'Djhon · Davi · Cristian', cargo:'Social Media', local:'Marketing'},
        {id:'p17', nome:'Rafael', cargo:'Video Maker', local:'Marketing'},
        {id:'p18', nome:'Lucas Oliveira', cargo:'Designer', local:'Marketing'}
      ]
    }
  ]
};

// Cores
const CORES = {
  dir: {f:'#791F1F', s:'#F09595', t:'#F7C1C1'},
  ges: {f:'#633806', s:'#EF9F27', t:'#FAC775'},
  lid: {f:'#27500A', s:'#97C459', t:'#C0DD97'},
  op: {f:'#085041', s:'#5DCAA5', t:'#9FE1CB'}
};

// Elementos
const el = {
  svg: document.getElementById('svgHierarquia'),
  areaEdicao: document.getElementById('areaEdicao'),
  btnEditar: document.getElementById('btnEditar'),
  btnVoltar: document.getElementById('btnVoltar'),
  listaEstrutura: document.getElementById('listaEstrutura'),
  selCatPessoa: document.getElementById('novaPessoaCat')
};

// Alternar telas
el.btnEditar.addEventListener('click', () => {
  el.areaEdicao.classList.add('ativa');
  atualizarListaEdicao();
  atualizarSelectCategorias();
});
el.btnVoltar.addEventListener('click', () => {
  el.areaEdicao.classList.remove('ativa');
});

// Gerar SVG da pirâmide
function gerarPiramide() {
  const svg = el.svg;
  let html = '';
  const c = dados.categorias;

  // Definir posições baseadas no número de níveis
  // Nível 0 — Topo (Direção)
  if(c[0]) {
    html += `<polygon points="832,0 1034,170 630,170" fill="${CORES[c[0].cor].f}" stroke="${CORES[c[0].cor].s}" stroke-width="2"/>`;
    c[0].pessoas.forEach((p, i) => {
      const y = 80 + (i * 32);
      html += `<text x="832" y="${y}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="24" font-weight="600" fill="${CORES[c[0].cor].t}">${p.nome}</text>`;
      html += `<text x="832" y="${y+28}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="20" fill="${CORES[c[0].cor].t}">${p.cargo}${p.local?' · '+p.local:''}</text>`;
    });
  }

  // Nível 1 — Segundo andar
  if(c[1]) {
    html += `<polygon points="623,176 1041,176 1129,250 535,250" fill="${CORES[c[1].cor].f}" stroke="${CORES[c[1].cor].s}" stroke-width="2"/>`;
    html += `<text x="515" y="222" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="24" font-weight="600" fill="${CORES[c[1].cor].t}">${c[1].nome}</text>`;
    c[1].pessoas.forEach((p, i) => {
      html += `<text x="515" y="${252 + (i*32)}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="20" fill="${CORES[c[1].cor].t}">${p.nome}${p.cargo?' · '+p.cargo:''}</text>`;
    });
  }

  // Nível 2 — Terceiro andar (Liderança)
  if(c[2]) {
    html += `<polygon points="656,256 1136,256 1391,470 656,470" fill="${CORES[c[2].cor].f}" stroke="${CORES[c[2].cor].s}" stroke-width="2"/>`;
    html += `<text x="950" y="302" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="24" font-weight="600" fill="${CORES[c[2].cor].t}">${c[2].nome}</text>`;
    const porLinha = 3;
    c[2].pessoas.forEach((p, i) => {
      const col = i % porLinha;
      const linha = Math.floor(i/porLinha);
      const x = 700 + col * 200;
      const y = 340 + linha * 34;
      html += `<text x="${x}" y="${y}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="19" fill="${CORES[c[2].cor].t}">${p.nome}</text>`;
      html += `<text x="${x}" y="${y+22}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="15" fill="${CORES[c[2].cor].t}">${p.cargo}${p.local?' — '+p.local:''}</text>`;
    });
  }

  // Nível 3 — Base (Operacional)
  if(c[3]) {
    html += `<polygon points="266,476 1398,476 1664,700 0,700" fill="${CORES[c[3].cor].f}" stroke="${CORES[c[3].cor].s}" stroke-width="2"/>`;
    html += `<text x="832" y="520" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="24" font-weight="600" fill="${CORES[c[3].cor].t}">${c[3].nome}</text>`;
    c[3].pessoas.forEach((p, i) => {
      html += `<text x="832" y="${562 + (i*30)}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="18" fill="${CORES[c[3].cor].t}">${p.nome}${p.cargo?' — '+p.cargo:''}${p.local?' ('+p.local+')':''}</text>`;
    });
  }

  svg.innerHTML = html;
}

// Atualizar select de categorias
function atualizarSelectCategorias() {
  el.selCatPessoa.innerHTML = dados.categorias.map(cat => 
    `<option value="${cat.id}">${cat.nome}</option>`
  ).join('');
}

// Atualizar lista na área de edição
function atualizarListaEdicao() {
  el.listaEstrutura.innerHTML = dados.categorias.map((cat, idx) => {
    return `
      <div class="categoria cat-${cat.cor}">
        <h3>${cat.nome}</h3>
        ${cat.pessoas.length === 0 ? '<p class="sem-dados">Nenhuma pessoa nesta categoria</p>' : ''}
        ${cat.pessoas.map(p => `
          <div class="pessoa">
            <div class="pessoa-nome"><strong>${p.nome}</strong><br><span class="pessoa-cargo">${p.cargo}${p.local?' · '+p.local:''}</span></div>
            <div class="pessoa-acoes">
              <button class="btn btn-secundario" onclick="editarPessoa('${cat.id}','${p.id}')">Editar</button>
              <button class="btn btn-perigo" onclick="excluirPessoa('${cat.id}','${p.id}')">Excluir</button>
            </div>
          </div>
        `).join('')}
        <div class="linha-botoes">
          ${idx > 0 ? `<button class="btn btn-secundario" onclick="moverCategoria(${idx},-1)">↑ Mover Categoria</button>` : ''}
          ${idx < dados.categorias.length-1 ? `<button class="btn btn-secundario" onclick="moverCategoria(${idx},1)">↓ Mover Categoria</button>` : ''}
          <button class="btn btn-perigo" onclick="excluirCategoria('${cat.id}')">Excluir Categoria</button>
        </div>
      </div>
    `;
  }).join('');
}

// Adicionar pessoa
document.getElementById('btnAddPessoa').addEventListener('click', () => {
  const nome = document.getElementById('novaPessoaNome').value.trim();
  const cargo = document.getElementById('novaPessoaCargo').value.trim();
  const local = document.getElementById('novaPessoaLocal').value.trim();
  const catId = document.getElementById('novaPessoaCat').value;
  
  if(!nome) return alert('Digite o nome');
  
  const cat = dados.categorias.find(c => c.id === catId);
  if(!cat) return;
  
  cat.pessoas.push({
    id: 'p' + Date.now(),
    nome, cargo, local
  });
  
  // Limpar
  document.getElementById('novaPessoaNome').value = '';
  document.getElementById('novaPessoaCargo').value = '';
  document.getElementById('novaPessoaLocal').value = '';
  
  atualizarTudo();
});

// Adicionar categoria
document.getElementById('btnAddCat').addEventListener('click', () => {
  const nome = document.getElementById('novaCatNome').value.trim();
  const cor = document.getElementById('novaCatCor').value;
  
  if(!nome) return alert('Digite o nome da categoria');
  
  dados.categorias.push({
    id: 'cat' + Date.now(),
    nome,
    cor,
    pessoas: []
  });
  
  document.getElementById('novaCatNome').value = '';
  atualizarTudo();
});

// Funções globais
window.editarPessoa = function(catId, pId) {
  const cat = dados.categorias.find(c => c.id === catId);
  const p = cat?.pessoas.find(x => x.id === pId);
  if(!p) return;
  
  const novoNome = prompt('Novo nome:', p.nome);
  if(novoNome === null) return;
  p.nome = novoNome || p.nome;
  
  const novoCargo = prompt('Novo cargo:', p.cargo);
  if(novoCargo !== null) p.cargo = novoCargo;
  
  const novoLocal = prompt('Loja/setor:', p.local);
  if(novoLocal !== null) p.local = novoLocal;
  
  atualizarTudo();
};

window.excluirPessoa = function(catId, pId) {
  if(!confirm('Excluir esta pessoa?')) return;
  const cat = dados.categorias.find(c => c.id === catId);
  if(!cat) return;
  cat.pessoas = cat.pessoas.filter(p => p.id !== pId);
  atualizarTudo();
};

window.excluirCategoria = function(catId) {
  if(!confirm('Excluir categoria e TODAS as pessoas nela?')) return;
  dados.categorias = dados.categorias.filter(c => c.id !== catId);
  atualizarTudo();
};

window.moverCategoria = function(idx, dir) {
  const novoIdx = idx + dir;
  if(novoIdx < 0 || novoIdx >= dados.categorias.length) return;
  [dados.categorias[idx], dados.categorias[novoIdx]] = [dados.categorias[novoIdx], dados.categorias[idx]];
  atualizarTudo();
};

function atualizarTudo() {
  gerarPiramide();
  atualizarListaEdicao();
  atualizarSelectCategorias();
}

// Inicializar
gerarPiramide();
</script>
</body>
</html>
